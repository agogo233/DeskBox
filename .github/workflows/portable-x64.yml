# Standalone x64 portable pipeline: runs on pushes to main and manual dispatch,
# fully isolated from other workflows. Runs the authoritative
# scripts/publish-aot-retail.ps1 to produce the AOT self-contained publish
# directory and uploads it; the artifact download is the portable zip itself.
name: Portable x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portable-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x64 portable package
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      RestoreLockedMode: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.303

      # The retail script embeds full validation (PE machine, forbidden files,
      # smoke-harness tokens, warning-code allowlist); any failure aborts.
      # Rust 1.96.0 is auto-installed by rustup from rust-toolchain.toml.
      - name: AOT retail publish
        shell: pwsh
        run: .\scripts\publish-aot-retail.ps1 -Platform x64

      - name: Resolve package name
        shell: pwsh
        run: |
          $short = (git rev-parse --short HEAD).Trim()
          Write-Output "ZIP_NAME=DeskBox_Portable_${short}_x64" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: .artifacts/aot-retail/win-x64/publish
          retention-days: 30
          if-no-files-found: error
